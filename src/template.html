<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Sixtyfour&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

<body>
  <div id="title-div"><h1>coldNote</h1></div>
  <div id="master-container"> 
    <div id="new-project-div">
        <button id="new-project-button">+</button>
    </div>
    <div id="projects-container">
        <!-- INSTANCE SAMPLE BEGINS HERE -->
        <div class="project-instance-div">
            <div class="project-instance-div-contents">
                <div class="contents-controls">
                    <span class="note-count">-3°</span>
                    <span class="project-title">Coding project</span>
                    <img class="handle" src="handle.png">
                    <button class="add-note-button" title="New note">+</button>
                    <button class="delete-project-button" title="Delete project!"><img src="vecteezy_biohazard_36657370.svg"></button>
                </div>
                <div class="contents-todos-container"></div>
            </div>
            <div class="project-instance-div-cover"></div>
        </div>
        <!-- INSTANCE SAMPLE ENDS HERE -->
    </div>
  </div>
</body>
</html>

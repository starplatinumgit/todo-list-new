<body>

    <audio id="music" src="./elevator-music.mp3" loop></audio>

    <button id="music-button">⏯️</button>
</div>

    <div id="new-project-div">
        <button title="new project" id="new-project-button">+</button>
    </div>
    <div id="projects-container">

    </div>
    <!-- NEW PROJECT DIALOG STARTS HERE -->
    <dialog id="new-project-dialog">
        <form id="new-project-form">
            <div id="new-project-form-div">
                <div id="new-project-close-div">
                    <button id="close-project-dialog" type="reset">X</button>
                </div>
                <p>> new project</p>
                <p>> please enter title below:</p>
                <div id="new-project-input-div">
                    <p>></p>
                    <input type="text" id="project-title" name="project-title" autocomplete="off">
                </div>
            </div>
        </form>
    </dialog>
    <!-- NEW PROJECT DIALOG ENDS HERE -->
    <!-- ARE YOU SURE DIALOG STARTS HERE -->
    <dialog id="delete-project-dialog">
        <form id="delete-project-form">
                <p>Delete this project and all of it's contents?</p>
                <div id="delete-project-buttons-div">
                    <button type="button" id="delete-project-confirm" type="submit">yes</button>
                    <button type="button" id="delete-project-decline" type="reset">no!</button>
                </div>
            </div>
        </form>
    </dialog>
    <!-- ARE YOU SURE DIALOG ENDS HERE -->

     <!-- NEW TODO DIALOG STARTS HERE -->
    <dialog id="new-todo-dialog">
        <form id="new-todo-form">
            <div id="new-todo-form-div">
                <div id="new-todo-close-div">
                    <button id="close-todo-dialog" type="reset">X</button>
                </div>
                <p>> new todo / edit todo</p>
                <label for="todo-title"> >Enter your todo title:</label>
                <div class="new-todo-input-div">
                    <p>></p>
                    <input autocomplete="off" type="text" id="todo-title" name="todo-title" class="todo-input" required>
                </div>
                <label for="todo-description"> >Describe this task:</label>
                <div class="new-todo-input-div">
                    <p>></p>
                    <textarea autocomplete="off" rows="3" id="todo-description" name="todo-description" class="todo-input"></textarea>
                </div>
                <label for="todo-date"> >When is this task due?:</label>
                <div class="new-todo-input-div">
                    <p>></p>
                    <input type="date" autocomplete="off" id="todo-date" name="todo-date" class="todo-input" required>
                </div>
                <label for="todo-priority"> >How urgent is this task?:</label>
                <div class="new-todo-input-div">
                    <p>></p>
                    <input type="range" min="0" max="2" id="todo-priority" name="todo-priority" class="todo-input" required>
                </div>
                <button type="submit">submit</button>
            </div>
        </form>
    </dialog>

     <!-- NEW TODO DIALOG ENDS HERE -->

  </div>
</body>

<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Todo_Corp</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Sixtyfour&display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Bitcount+Single:wght@100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&display=swap" rel="stylesheet"><script defer="defer" src="app.bundle.js"></script><link href="app.bundle.css" rel="stylesheet"></head><body><div id="title-div"><audio id="music" src="9c3bcd1d336a253e1744.mp3" loop></audio><h1>💻toDo_Corp</h1><button id="music-button">⏯️</button></div><div id="master-container"><div id="new-project-div"><button title="new project" id="new-project-button">+</button></div><div id="projects-container"></div><dialog id="new-project-dialog"><form id="new-project-form"><div id="new-project-form-div"><div id="new-project-close-div"><button id="close-project-dialog" type="reset">X</button></div><p>> new project</p><p>> please enter title below:</p><div id="new-project-input-div"><p>></p><input id="project-title" name="project-title" autocomplete="off"></div></div></form></dialog><dialog id="delete-project-dialog"><form id="delete-project-form"><p>Delete this project and all of it's contents?</p><div id="delete-project-buttons-div"><button type="button" id="delete-project-confirm" type="submit">yes</button> <button type="button" id="delete-project-decline" type="reset">no!</button></div></form></dialog></div><dialog id="new-todo-dialog"><form id="new-todo-form"><div id="new-todo-form-div"><div id="new-todo-close-div"><button id="close-todo-dialog" type="reset">X</button></div><p>> new todo / edit todo</p><label for="todo-title">>Enter your todo title:</label><div class="new-todo-input-div"><p>></p><input autocomplete="off" id="todo-title" name="todo-title" class="todo-input" required></div><label for="todo-description">>Describe this task:</label><div class="new-todo-input-div"><p>></p><textarea autocomplete="off" rows="3" id="todo-description" name="todo-description" class="todo-input"></textarea></div><label for="todo-date">>When is this task due?:</label><div class="new-todo-input-div"><p>></p><input type="date" autocomplete="off" id="todo-date" name="todo-date" class="todo-input" required></div><label for="todo-priority">>How urgent is this task?:</label><div class="new-todo-input-div"><p>></p><input type="range" min="0" max="2" id="todo-priority" name="todo-priority" class="todo-input" required></div><button type="submit">submit</button></div></form></dialog></body><footer id="footer">© 2026 S K · <a target="_blank" href="https://github.com/starplatinumgit/todo-list-new">Github</a></footer></html>
